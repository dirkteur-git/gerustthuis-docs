<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- GerustThuis — OG Image / Website Share -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&amp;family=DM+Sans:wght@400;500&amp;display=swap');
    </style>
  </defs>
  <rect width="1200" height="630" fill="#4A7B58"/>
  
  <!-- Grain texture overlay -->
