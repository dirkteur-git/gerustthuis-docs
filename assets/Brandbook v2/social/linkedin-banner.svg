<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396" fill="none">
  <!-- GerustThuis — LinkedIn Banner -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&amp;family=DM+Sans:wght@400;500&amp;display=swap');
    </style>
  </defs>
  <rect width="1584" height="396" fill="#FEFCFA"/>
  
  <!-- Subtle texture band at bottom -->
  <rect y="370" width="1584" height="26" fill="#F7F4F0"/>
  <rect y="369" width="1584" height="1" fill="#E8E4DF"/>
  
  <!-- Left: sage accent bar -->
  <rect width="6" height="396" fill="#4A7B58"/>
  
  <!-- Logo icon -->
  <g transform="translate(80, 110)">
    <rect width="80" height="80" rx="20" fill="#4A7B58"/>
    <path d="M15 44 L40 22 L65 44" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 50 C30 46, 35 42, 40 46 C45 42, 50 46, 50 50 C50 57, 40 63, 40 63 C40 63, 30 57, 30 50Z" fill="#F0C896"/>
  </g>
  
  <!-- Wordmark -->
  <text x="180" y="162" style="font-family: 'DM Serif Display', Georgia, serif; font-size: 44px;">
    <tspan fill="#4A7B58">Gerust</tspan><tspan fill="#2C2C2C">Thuis</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="82" y="228" style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; fill: #5A5A5A; font-weight: 400;">
    Mantelzorgers gemoedsrust geven door slimme,
  </text>
  <text x="82" y="254" style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; fill: #5A5A5A; font-weight: 400;">
    onopvallende monitoring van hun dierbaren.
  </text>
  
  <!-- URL -->
  <text x="82" y="310" style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; fill: #4A7B58; font-weight: 500; letter-spacing: 0.05em;">
    gerustthuis.care
  </text>
  
  <!-- Right side: large decorative logo mark -->
  <g transform="translate(1100, -40)" opacity="0.06">
    <path d="M80 260 L240 100 L400 260" stroke="#4A7B58" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M170 300 C170 268, 206 236, 240 268 C274 236, 310 268, 310 300 C310 348, 240 396, 240 396 C240 396, 170 348, 170 300Z" fill="#D4A574"/>
  </g>
</svg>
