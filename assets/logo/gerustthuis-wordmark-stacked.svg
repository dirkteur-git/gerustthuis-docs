<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" width="140" height="120">
  <!-- GerustThuis Wordmark - Stacked -->
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&amp;display=swap');
      .wordmark { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 600; }
      .gerust { fill: #10b981; }
      .thuis { fill: #111827; }
    </style>
  </defs>
  
  <!-- Icon centered -->
  <g transform="translate(38, 0)">
    <rect width="64" height="64" rx="14" fill="#10b981"/>
    <path d="M10 34 L32 14 L54 34" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="44" r="4" fill="#ffffff"/>
    <circle cx="32" cy="44" r="8" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <circle cx="32" cy="44" r="13" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25"/>
  </g>
  
  <!-- Wordmark centered below -->
  <text x="70" y="100" text-anchor="middle" class="wordmark">
    <tspan class="gerust">Gerust</tspan><tspan class="thuis">Thuis</tspan>
  </text>
</svg>
