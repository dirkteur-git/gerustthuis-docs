<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="340" height="64">
  <!-- GerustThuis Pro Wordmark - Horizontal -->
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&amp;display=swap');
      .wordmark { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 600; }
      .gerust { fill: #10b981; }
      .thuis { fill: #111827; }
      .pro { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #ffffff; }
    </style>
  </defs>
  
  <!-- Icon - Pro variant -->
  <g transform="translate(0, 0)">
    <rect width="64" height="64" rx="14" fill="#111827"/>
    <path d="M10 34 L32 14 L54 34" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="44" r="4" fill="#10b981"/>
    <circle cx="32" cy="44" r="8" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
    <circle cx="32" cy="44" r="13" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.25"/>
  </g>
  
  <!-- Wordmark -->
  <text x="80" y="42" class="wordmark">
    <tspan class="gerust">Gerust</tspan><tspan class="thuis">Thuis</tspan>
  </text>
  
  <!-- Pro badge -->
  <rect x="255" y="20" width="42" height="24" rx="4" fill="#111827"/>
  <text x="276" y="37" text-anchor="middle" class="pro">PRO</text>
</svg>
